name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter pub get

      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/

      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # Every APK must carry the same signature, or Android refuses to update
      # the installed app. main never falls back to the debug key.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repo secrets (see README)."
              exit 1
            fi
            echo "::warning::Signing secrets not set; this APK uses a throwaway debug key and won't install over a release build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=margin
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number ${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/margin-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: margin-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Margin build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download the APK on the tablet and install it over the old one." \
            --latest
